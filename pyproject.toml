[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "jarvis-kernel"
version = "0.1.0"
description = "Local-first JARVIS kernel contracts and development foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11,<3", "jsonschema>=4.23,<5"]

[project.scripts]
jarvis = "jarvis.__main__:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
