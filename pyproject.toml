[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "jarvis-kernel"
version = "0.10.0"
description = "JARVIS local voice and ambient development runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11,<3",
    "jsonschema>=4.23,<5",
    "httpx>=0.28,<1",
    "fastapi>=0.115,<0.126",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
voice = ["sounddevice>=0.5,<1"]

[project.scripts]
jarvis = "jarvis.__main__:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
